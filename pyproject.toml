[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spantrace"
version = "0.2.0"
description = "Framework-independent observability for multi-agent applications"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "packages/python-sdk/tests", "tests"]
pythonpath = ["services/api", "packages/python-sdk"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.setuptools.packages.find]
where = ["packages/python-sdk"]
