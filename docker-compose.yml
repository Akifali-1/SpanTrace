services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentscope
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope
    ports:
      - "5432:5432"
    volumes:
      - agentscope-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      SPANTRACE_DATABASE_URL: postgresql+psycopg://agentscope:agentscope@postgres:5432/agentscope
      SPANTRACE_CORS_ORIGINS: http://localhost:3070
    ports:
      - "8070:8000"
    depends_on:
      - postgres

  # The API launches this image per execution with tighter per-run limits.
  # Build it explicitly; it is not an always-on worker or a Docker socket mount.
  worker-image:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: spantrace-worker:0.1.0
    profiles: [execution-image]

volumes:
  agentscope-postgres:
